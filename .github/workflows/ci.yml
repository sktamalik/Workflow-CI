name: CI Retrain Model

on:
  workflow_dispatch:
  push:
    paths:
      - "MLProject/**"

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('MLProject/conda.yaml') }}

      - name: Install MLflow + dependencies
        run: |
          pip install mlflow==2.19.0
          pip install dagshub scikit-learn pandas numpy matplotlib

      - name: Konfigurasi DagsHub MLflow tracking
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          echo "DAGSHUB_USER_TOKEN=$DAGSHUB_USER_TOKEN" >> $GITHUB_ENV

      - name: MLflow run MLProject (retrain)
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow run MLProject --env-manager local --entry-point main

      - name: Upload artefak ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-trained-model
          path: |
            mlruns/
            **/*.png
            **/model/

      - name: Ambil run id terakhir dari MLflow tracking
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python - <<'PY' > run_id.txt
          import os
          import dagshub
          import mlflow

          if os.environ.get("DAGSHUB_USER_TOKEN"):
              dagshub.init(repo_owner="sktamalik", repo_name="diabetes-mlflow", mlflow=True)

          exp = mlflow.get_experiment_by_name("Workflow-CI") or mlflow.get_experiment_by_name("Default")
          runs = mlflow.search_runs(experiment_ids=[exp.experiment_id], order_by=["start_time DESC"])
          print(runs.iloc[0]["run_id"])
          PY
          echo "RUN_ID=$(cat run_id.txt)"

      - name: Build Docker image dari model MLflow (mlflow build-docker)
        run: |
          RUN_ID=$(cat run_id.txt)
          mlflow models build-docker \
            --model-uri "runs:/${RUN_ID}/model" \
            --name sktamalik/diabetes-ml-ci \
            --env-manager local
          docker images | grep diabetes-ml-ci

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image ke Docker Hub
        run: |
          docker tag sktamalik/diabetes-ml-ci:latest sktamalik/diabetes-ml:ci
          docker push sktamalik/diabetes-ml:ci

      - name: Verify model artifact
        run: |
          python -c "
          import mlflow
          mlflow.set_tracking_uri('http://127.0.0.1:5000')
          exp = mlflow.get_experiment_by_name('Workflow-CI')
          runs = mlflow.search_runs(experiment_ids=[exp.experiment_id])
          print(f'Total runs: {len(runs)}')
          assert len(runs) > 0, 'No MLflow run found'
          print('CI retrain success: model artifact logged')
          " || echo "Local tracking not persisted (DagsHub online mode active)"