name: CI Retrain Model

on:
  workflow_dispatch:
  push:
    paths:
      - "MLProject/**"

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('MLProject/conda.yaml') }}

      - name: Install MLflow + dependencies
        run: |
          pip install mlflow==2.19.0
          pip install dagshub scikit-learn pandas numpy matplotlib

      - name: Konfigurasi DagsHub MLflow tracking
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          echo "DAGSHUB_TOKEN=$DAGSHUB_TOKEN" >> $GITHUB_ENV

      - name: MLflow run MLProject (retrain)
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow run MLProject --env-manager local --entry-point main

      - name: Upload artefak ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-trained-model
          path: |
            mlruns/
            **/*.png
            **/model/

      - name: Verify model artifact
        run: |
          python -c "
          import mlflow
          mlflow.set_tracking_uri('http://127.0.0.1:5000')
          exp = mlflow.get_experiment_by_name('Workflow-CI')
          runs = mlflow.search_runs(experiment_ids=[exp.experiment_id])
          print(f'Total runs: {len(runs)}')
          assert len(runs) > 0, 'No MLflow run found'
          print('CI retrain success: model artifact logged')
          " || echo "Local tracking not persisted (DagsHub online mode active)"